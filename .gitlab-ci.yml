include:
  - project: 'p4858/ci-cd/gitlab-ci'
    ref: main
    file: '/src/laravel.yml'

mysql-invariants:
  stage: test
  services:
    - name: mysql:8.4
      alias: mysql
  variables:
    MYSQL_DATABASE: stockflow_test
    MYSQL_ROOT_PASSWORD: password
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: '3306'
    DB_DATABASE: stockflow_test
    DB_USERNAME: root
    DB_PASSWORD: password
  script:
    - composer install --no-interaction --prefer-dist
    - php artisan migrate --force
    - php -d memory_limit=512M vendor/bin/pest tests/Feature/App/Models/StockMovementSequenceTest.php tests/Feature/App/Services/StockMovementServiceTest.php tests/Feature/App/Services/InventorySessionServiceTest.php tests/Feature/App/Http/Controllers/Web/StockMovement/StockMovementReverseControllerTest.php
